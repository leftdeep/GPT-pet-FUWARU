name: Windows portable release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-release.yml'
      - 'scripts/package-portable.ps1'
permissions:
  contents: write
concurrency:
  group: windows-portable-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare video decoder for checks
        shell: pwsh
        run: ./scripts/setup-runtime.ps1
      - name: Build and check source
        shell: pwsh
        run: ./build.ps1
      - name: Package Windows portable app
        shell: pwsh
        run: ./scripts/package-portable.ps1 -OutputDirectory "$env:RUNNER_TEMP/fuwaru-package"
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $package = Get-Content -LiteralPath "$env:RUNNER_TEMP/fuwaru-package/package-result.json" -Raw | ConvertFrom-Json
          $tag = 'v' + $package.Version + '-portable-' + $env:GITHUB_RUN_NUMBER
          $notes = "$env:RUNNER_TEMP/fuwaru-package/release-notes.md"
          @'
          下载 FUWARU-*-windows-x64.zip，解压整个文件夹后双击“启动芙哇噜.cmd”。
          包含 .NET 运行环境和现用全部 9 个动作，无需编译。首次启动需联网，自动下载并校验 FFmpeg。
          适用于 Windows 10/11 x64。请勿下载下面的 Source code ZIP 作为运行程序。
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create $tag $package.Zip ($package.Zip + '.sha256') --target $env:GITHUB_SHA --title ('芙哇噜 ' + $package.Version + ' Windows 便携版') --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw '发布下载失败。' }
